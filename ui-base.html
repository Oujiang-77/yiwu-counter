function photoResult(r){const p=products.find(p=>p.id===r.id);if(!p)return {ok:false,text:'未匹配商品，请手动选择。'};if(!r.unit)return {ok:false,text:'数量单位不明，请对照原图确认。'};if(!Number.isInteger(r.quantity)||r.quantity<=0||r.quantity>1000000)return {ok:false,text:'数量须为 1～100 万的整数。'};const cases=r.unit==='个'?r.quantity/p.pack:r.quantity;if(!Number.isInteger(cases))return {ok:false,text:r.quantity+' 个不足整件（每件 '+p.pack+' 个），请核对数量。'};return {ok:true,p,cases,units:cases*p.pack,text:cases+' 件 × '+p.pack+' 个/件 = '+cases*p.pack+' 个'} }

function updatePhotoSummary(){const totals=photoTotals();for(const r of photoRows){const calc=photoResult(r),bad=calc.ok&&totals.minimums.some(([id])=>id===r.id),tag=$('#photoTag'+r.key),line=$('#photoCalc'+r.key);line.textContent=calc.text;line.classList.toggle('invalid',!calc.ok);tag.textContent=!calc.ok?'待修正':bad?'起订量不足':r.reviewed?'已核对':'待人工核对';tag.classList.toggle('needs-review',!calc.ok||!r.reviewed||bad);const box=$('[data-photo-field="reviewed"][data-key="'+r.key+'"]');box.disabled=!calc.ok;box.checked=r.reviewed&&calc.ok}$('#photoIssueSummary').textContent=totals.problems+totals.unreviewed+totals.minimums.length?'请完成核对':'全部核对完成';$('#photoMinimums').innerHTML=totals.minimums.map(([id,q])=>{let p=products.find(p=>p.id===id);return '<div class="notice" style="margin:10px 0">'+esc(p.code)+' 合计 '+q+' 件；'+(q>1000000?'超出 100 万件上限。':'最低 '+p.min+' 件起订，请核对数量。')+'</div>'}).join('');let cases=[...totals.groups.values()].reduce((a,b)=>a+b,0);$('#photoConfirmSummary').textContent=totals.problems?'还有 '+totals.problems+' 行需要修正商品或数量':totals.unreviewed?'还有 '+totals.unreviewed+' 行未勾选核对':totals.minimums.length?'请修正起订件数或件数上限':'共 '+totals.groups.size+' 款商品 · '+cases+' 件';$('#photoApplyButton').disabled=!totals.valid}

function exportOrder(){let groups={};for(const p of picked()){if(!Number.isInteger(qty(p))||qty(p)<p.min)return toast('请先修正订货件数');(groups[p.factory]??=[]).push(p)}if(mode==='single')download(buildXlsx(groups),'厂家报货单_示例.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');else download(zip(Object.entries(groups).map(([f,ps],i)=>[(i+1)+'_'+f.replace(/[<>:"\/\\|?*]/g,'_')+'_报货单.xlsx',buildXlsx({[f]:ps})])),'分厂家报货单_示例.zip','application/zip');toast('已发起文件下载，请查看浏览器下载记录');if(!$('#finishOrderButton')){$('#exportButton').insertAdjacentHTML('beforebegin','<button id="finishOrderButton" data-action="finishOrder">完成本次并清空</button>');$('#exportButton').textContent='再次下载';$('#dialog .dialog-foot small').textContent='确认文件已下载后，可完成本次开单。关闭弹窗会保留清单。'}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;let a=b.dataset.action,id=Number(b.dataset.id);if(a==='viewMode'){viewMode=b.dataset.view;render()}else if(a==='pending')showPending();else if(a==='countInfo')countInfo();else if(a==='pendingRemove'){selected.delete(id);render();showPending()}else if(a==='pendingOrder'){closeDialog();order()}else if(a==='finishOrder'){selected.clear();quantities={};closeDialog();render();toast('本次开单已完成，待开单清单已清空')}else if(a==='close')closeDialog();else if(a==='all'||a==='reset'){activePage='products';query='';factory='';category='';render()}else if(a==='search'){query=($('#search')||$('#batchSearch')).value;render()}else if(a==='example'){query='A-13, B-07, C-03';factory='';category='';render()}else if(a==='cat'){category=b.dataset.cat;render()}else if(a==='clear'){selected.clear();render()}else if(a==='toggle'){selected.has(id)?selected.delete(id):selected.add(id);render()}else if(a==='addAll'){result().forEach(p=>selected.add(p.id));render()}else if(a==='detail')detail(id);else if(a==='detailPick'){selected.has(id)?selected.delete(id):selected.add(id);closeDialog();render()}else if(a==='new'||a==='edit')newForm(a==='edit'?id:0);else if(a==='order')order();else if(a==='export')exportOrder();else if(a==='import')showImport(1);else if(a==='importNext')showImport(2);else if(a==='importValidate')validateImport();else if(a==='importCommit')importCommit();else if(a==='update')showUpdate();else if(a==='updateStart')runUpdate(b);else if(a==='backup')backup();else if(a==='suppliers')suppliers();else if(a==='filterFactory'){activePage='products';factory=b.dataset.factory;query='';category='';closeDialog();render()}});
document.addEventListener('change',e=>{let t=e.target;if(t.dataset.select){let id=Number(t.dataset.select);t.checked?selected.add(id):selected.delete(id);render()}else if(t.id==='selectAll'){result().forEach(p=>t.checked?selected.add(p.id):selected.delete(p.id));render()}else if(t.id==='factory'){factory=t.value;render()}else if(t.name==='exportMode'){mode=t.value;refreshOrder()}});
