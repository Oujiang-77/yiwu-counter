name: 发布 Windows 安装包

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装构建依赖
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-lock.txt
      - name: 校验标签版本
        shell: pwsh
        run: |
          $version = .\.venv\Scripts\python.exe -c "from storage import VERSION; print(VERSION)"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "标签 $env:GITHUB_REF_NAME 与程序版本 $version 不一致" }
      - name: 构建并打包
        run: .\build.ps1
      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: 构建固定目录安装程序
        shell: pwsh
        run: .\build_installer.ps1
      - name: 验证重复安装和桌面图标
        shell: pwsh
        run: |
          $version = .\.venv\Scripts\python.exe -c "from storage import VERSION; print(VERSION)"
          $installer = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "outputs/HuoYouShu-Setup-$version-Windows-x64.exe"
          $target = Join-Path $env:LOCALAPPDATA 'Programs/HuoYouShu/档口开单系统.exe'
          foreach ($pass in 1, 2) {
            & $installer /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $target)) { throw "第 $pass 次安装失败" }
          }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) '档口开单系统.lnk'
          if (-not (Test-Path -LiteralPath $shortcut)) { throw '桌面图标未创建' }
          $shell = New-Object -ComObject WScript.Shell
          $actual = $shell.CreateShortcut($shortcut).TargetPath
          if ($actual -ne $target) { throw "桌面图标指向错误：$actual" }
      - name: 创建 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $outputDir = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'outputs'
          $version = .\.venv\Scripts\python.exe -c "from storage import VERSION; print(VERSION)"
          $installer = Join-Path $outputDir "HuoYouShu-Setup-$version-Windows-x64.exe"
          $assets = @($installer, "$installer.sha256.txt")
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "缺少发布文件：$asset" }
          }
          gh release create $env:GITHUB_REF_NAME $assets --title "档口开单系统 $env:GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
