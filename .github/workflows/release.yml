name: 发布 Windows 安装包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装构建依赖
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-lock.txt
      - name: 校验发布版本
        shell: pwsh
        run: |
          $version = .\.venv\Scripts\python.exe -c "from storage import VERSION; print(VERSION)"
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }
          if ($tag -ne "v$version") { throw "发布标签 $tag 与程序版本 $version 不一致" }
      - name: 构建并打包
        run: .\build.ps1
      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: 构建固定目录安装程序
        shell: pwsh
        run: .\build_installer.ps1
      - name: 验证重复安装和桌面图标
        shell: pwsh
        run: |
          $version = .\.venv\Scripts\python.exe -c "from storage import VERSION; print(VERSION)"
          $installer = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "outputs/HuoYouShu-Setup-$version-Windows-x64.exe"
          $targetDir = Join-Path $env:LOCALAPPDATA 'Programs\HuoYouShu'
          $target = Join-Path $targetDir '档口开单系统.exe'
          foreach ($pass in 1, 2) {
            $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$targetDir`"")
            $result = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
            if ($result.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $target)) {
              $listing = if (Test-Path -LiteralPath $targetDir) { (Get-ChildItem -LiteralPath $targetDir -Force | Out-String) } else { '<目标目录不存在>' }
              throw "第 $pass 次安装失败，退出码 $($result.ExitCode)，目标文件：$target`n$listing"
            }
          }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) '档口开单系统.lnk'
          if (-not (Test-Path -LiteralPath $shortcut)) { throw '桌面图标未创建' }
      - name: 创建或更新 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $outputDir = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'outputs'
          $version = .\.venv\Scripts\python.exe -c "from storage import VERSION; print(VERSION)"
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }
          $installer = Join-Path $outputDir "HuoYouShu-Setup-$version-Windows-x64.exe"
          $assets = @($installer, "$installer.sha256.txt")
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "缺少发布文件：$asset" }
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets --title "档口开单系统 $tag" --notes-file RELEASE-NOTES.md
          }
